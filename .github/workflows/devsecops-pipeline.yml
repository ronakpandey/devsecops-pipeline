name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Step 1 - Scan for Exposed Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
        with:
          args: --log-opts="-1"

      - name: Step 2 - Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 3 - Static Application Security Testing (Bandit SAST)
        run: |
          pip install bandit
          bandit -r App/ -ll -ii

      - name: Step 4 - Scan Python Dependencies (pip-audit SCA)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r App/requirements.txt

      - name: Step 5 - Build Docker Container Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} -t ghcr.io/${{ github.repository }}:latest .

      - name: Step 6 - Container Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Step 7 - Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 8 - Publish Scanned Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Step 9 - Quality Gate Passed
        run: |
          echo "All automated DevSecOps security gates passed and image published successfully!"